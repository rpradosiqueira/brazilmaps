name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            r: devel
            latex: true
            check_args: 'c("--as-cran")'
          - os: ubuntu-latest
            r: release
            latex: false
            check_args: 'c("--no-manual", "--as-cran")'
          - os: windows-latest
            r: release
            latex: false
            check_args: 'c("--no-manual", "--as-cran")'
          - os: macos-latest
            r: release
            latex: false
            check_args: 'c("--no-manual", "--as-cran")'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.latex

      - name: Install LaTeX packages required by the PDF manual
        if: matrix.config.latex
        run: tlmgr install courier makeindex

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check_args }}
          upload-snapshots: true
